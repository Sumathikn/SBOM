[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbomguard"
version = "2.0.0"
description = "Automated Framework for SBOM Generation, Vulnerability Analysis, and Supply Chain Risk Assessment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SBOMGuard Team", email = "security@sbomguard.dev" }
]
keywords = ["sbom", "cyclonedx", "spdx", "vulnerabilities", "devsecops", "cisa-kev", "supply-chain"]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "defusedxml>=0.7.1",
    "packageurl-python>=0.11.0",
    "packaging>=23.0",
    "typer>=0.9.0",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "rich>=13.0.0",
]

[project.scripts]
sbomguard = "sbomguard.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sbomguard*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
